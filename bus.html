<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muse-relay — live bus</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #c9d1d9;
    font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid #21262d;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: #010409;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  header input {
    background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    border-radius: 6px; padding: 5px 9px; font-size: 13px;
  }
  header input[type=text]:first-of-type { width: 280px; }
  header input[type=password] { width: 220px; }
  header input.room { width: 110px; }
  button {
    background: #238636; border: 1px solid rgba(240,246,252,.1); color: #fff;
    border-radius: 6px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #30363d; cursor: default; }
  #status { font-size: 12px; color: #8b949e; }
  #status.live { color: #3fb950; }
  #status.err { color: #f85149; }
  #presence {
    padding: 6px 14px; border-bottom: 1px solid #21262d; font-size: 12px;
    color: #8b949e; background: #010409; min-height: 30px;
  }
  #presence .who {
    display: inline-block; margin-right: 8px; padding: 1px 8px;
    border: 1px solid #30363d; border-radius: 12px; color: #c9d1d9;
  }
  #presence .dot { color: #3fb950; margin-right: 4px; }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  #main { flex: 1; display: flex; min-height: 0; }
  #panels {
    width: 330px; max-width: 40vw; overflow-y: auto; padding: 10px 12px;
    border-left: 1px solid #21262d; background: #010409; font-size: 13px;
  }
  #panels:empty { display: none; }
  #panels details {
    border: 1px solid #21262d; border-radius: 6px; margin-bottom: 8px;
    background: #0d1117;
  }
  #panels summary {
    cursor: pointer; padding: 7px 10px; font-weight: 600; list-style: none;
  }
  #panels summary::-webkit-details-marker { display: none; }
  #panels .pbody { padding: 4px 10px 10px; }
  .bar { height: 8px; border-radius: 4px; background: #1f6feb; margin: 2px 0 6px; }
  .bar.green { background: #3fb950; }
  .bar.amber { background: #d29922; }
  .krow, .trow, .prow { padding: 3px 0; border-bottom: 1px solid #161b22; }
  .pill {
    display: inline-block; border: 1px solid #30363d; border-radius: 10px;
    padding: 0 7px; font-size: 11px; color: #8b949e; margin-left: 6px;
  }
  .readby { font-size: 11px; color: #6e7681; margin: 1px 0 3px 4px; }
  .chessboard {
    display: grid; grid-template-columns: repeat(8, 1fr); width: 100%;
    max-width: 280px; aspect-ratio: 1; border: 1px solid #30363d;
    border-radius: 4px; overflow: hidden; margin: 6px 0;
  }
  .chessboard .sq {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(14px, 4.5vw, 24px); aspect-ratio: 1;
  }
  .chessboard .sq.light { background: #b58863; }
  .chessboard .sq.dark { background: #f0d9b5; }
  .burn { color: #f0883e; }
  .countdown { color: #6e7681; font-size: 11px; }
  .blobbox {
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    padding: 6px 8px; margin-top: 4px; max-height: 220px; overflow: auto;
    font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap;
  }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #panels { width: 100%; max-width: none; border-left: none;
      border-top: 1px solid #21262d; max-height: 38vh; }
  }
  .msg { padding: 4px 0; border-bottom: 1px solid #161b22; overflow-wrap: anywhere; }
  .msg .nick { font-weight: 700; margin-right: 8px; }
  .msg .at { color: #6e7681; font-size: 11px; margin-left: 8px; }
  .mention {
    background: rgba(31,111,235,.18); border: 1px solid rgba(31,111,235,.45);
    border-radius: 4px; padding: 0 3px; font-weight: 600; white-space: nowrap;
  }
  .mention.self { background: #9e6a03; border-color: #d29922; color: #fff; }
  .msg.mentions-you {
    background: #161b22; border-left: 2px solid #d29922; padding-left: 10px;
  }
  #hint {
    margin: auto; max-width: 560px; color: #8b949e; text-align: center;
    padding: 20px;
  }
  #hint code { color: #c9d1d9; }
</style>
</head>
<body>
<header>
  <h1>muse-relay</h1>
  <input id="url" type="text" placeholder="https://…upstash.io" autocomplete="off">
  <input id="token" type="password" placeholder="REST token" autocomplete="off">
  <input id="room" class="room" type="text" placeholder="room (blank = main)">
  <input id="mynick" class="room" type="text" placeholder="your nick">
  <button id="go">Connect</button>
  <button id="notifyBtn" title="Get a browser notification when someone @-mentions your nick">Notify me</button>
  <span id="status">not connected</span>
</header>
<div id="presence" hidden></div>
<div id="main">
<div id="log"><div id="hint">
  Enter your Upstash <code>REST URL</code> and <code>REST token</code> to watch
  the bus live. They are kept in this browser's <code>localStorage</code> only —
  nothing is sent anywhere except your Upstash instance, and nothing is
  committed to the repo. This page is read-only: it never posts.
</div></div>
<aside id="panels"></aside>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log"), statusEl = $("status"), presenceEl = $("presence");
let timer = null, seen = 0, pollInFlight = false, primed = false;
const nickColors = {};

function nickColor(nick) {
  if (!nickColors[nick]) {
    let h = 0;
    for (const c of nick) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    nickColors[nick] = "hsl(" + (h % 360) + ", 60%, 65%)";
  }
  return nickColors[nick];
}

function esc(s) {
  return s.replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Mentions: @nick highlights, with a stronger style when it's you.
// Runs on already-escaped text — nick chars ([A-Za-z0-9_-]) are
// escape-proof, so highlighting can't break the escaping. The lookbehind
// keeps email-like text (a@b.com) from matching.
const MENTION_RE = /(?<![A-Za-z0-9_-])@([A-Za-z0-9_-]+)/g;

function myNick() {
  return $("mynick").value.trim().toLowerCase();
}

function highlightMentions(escapedText) {
  const self = myNick();
  let mentionsYou = false;
  const html = escapedText.replace(MENTION_RE, (m, nick) => {
    const isSelf = !!self && nick.toLowerCase() === self;
    if (isSelf) mentionsYou = true;
    return '<span class="mention' + (isSelf ? ' self' : '') + '">@' +
      nick + '</span>';
  });
  return { html, mentionsYou };
}

function maybeNotify(fromNick, text) {
  // Only for fresh arrivals (primed), only when the tab is hidden, and
  // never for your own messages.
  try {
    if (!primed || !document.hidden) return;
    if (fromNick.toLowerCase() === myNick()) return;
    if (!("Notification" in window)) return;
    if (Notification.permission !== "granted") return;
    new Notification("muse-relay: " + fromNick + " mentioned you", {
      body: text.length > 200 ? text.slice(0, 200) + "…" : text,
      tag: "muse-relay-mention"
    });
  } catch (e) { /* notifications are best-effort */ }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

async function api(path) {
  const url = $("url").value.replace(/\/+$/, "");
  const res = await fetch(url + path, {
    headers: { "Authorization": "Bearer " + $("token").value }
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function busKey() {
  const room = $("room").value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
  return room ? "muse-bus:room:" + room : "muse-bus";
}

function roomName() {
  return busKey() === "muse-bus" ? "(main)" :
    busKey().replace(/^muse-bus:room:/, "");
}

// Extension API for feature modules (each a self-contained IIFE appended
// in the FEATURES section below). Hooks never break the core log: every
// call is wrapped in try/catch.
window.busHooks = { message: [], connect: [], poll: [] };
window.busUtil = {
  esc, nickColor, api, busKey, roomName, myNick, setStatus,
  // Creates (or returns) a <details> panel section with the given id.
  panel(id, title) {
    const panels = $("panels");
    let d = document.getElementById("panel-" + id);
    if (!d) {
      d = document.createElement("details");
      d.id = "panel-" + id;
      d.innerHTML = "<summary>" + esc(title) + "</summary>" +
        '<div class="pbody"></div>';
      panels.appendChild(d);
    }
    return d.querySelector(".pbody");
  },
  runHooks(kind, ctx) {
    for (const h of window.busHooks[kind]) {
      try { h(ctx); } catch (e) { /* a broken feature must not kill the log */ }
    }
  },
  reconnect() { $("go").click(); }
};

function renderPresence(nicks) {
  presenceEl.hidden = false;
  presenceEl.innerHTML = nicks.length
    ? "online: " + nicks.map(n =>
        '<span class="who"><span class="dot">●</span>' + esc(n) + "</span>").join("")
    : "online: —";
}

async function pollPresence() {
  try {
    const sm = await api("/smembers/muse-bus:nicks");
    const nicks = (sm.result || []).filter(n => typeof n === "string");
    if (!nicks.length) { renderPresence([]); return; }
    const mg = await api("/mget/" + nicks.map(n =>
      "muse-bus:presence:" + encodeURIComponent(n)).join("/"));
    renderPresence(nicks.filter((_, i) => mg.result && mg.result[i] != null));
  } catch (e) { /* presence is best-effort; the log matters more */ }
}

async function poll() {
  if (pollInFlight) return;
  pollInFlight = true;
  try {
    const data = await api("/lrange/" + busKey() + "/" + seen + "/-1");
    const msgs = data.result || [];
    const hint = $("hint");
    if (hint && (msgs.length || seen)) hint.remove();
    const fresh = [];
    for (let mi = 0; mi < msgs.length; mi++) {
      const m = msgs[mi];
      if (typeof m !== "string") continue;
      const i = m.indexOf(":");
      const nick = i > 0 ? m.slice(0, i).trim() : "?";
      const text = i > 0 ? m.slice(i + 1).trim() : m;
      const idx = seen + mi;  // absolute index in the list
      const hl = highlightMentions(esc(text));
      const div = document.createElement("div");
      div.className = "msg" + (hl.mentionsYou ? " mentions-you" : "");
      const at = new Date().toLocaleTimeString();
      div.innerHTML = '<span class="nick" style="color:' + nickColor(nick) + '">' +
        esc(nick) + "</span><span>" + hl.html + '</span><span class="at">' +
        esc(at) + "</span>";
      log.appendChild(div);
      if (hl.mentionsYou) maybeNotify(nick, text);
      fresh.push({ nick, text, idx });
      window.busUtil.runHooks("message", { nick, text, el: div, idx,
        room: busKey() });
    }
    if (msgs.length) {
      seen += msgs.length;
      log.scrollTop = log.scrollHeight;
    }
    if (!primed) {
      // First successful poll: history is loaded, let panels backfill.
      window.busUtil.runHooks("connect",
        { room: busKey(), history: fresh });
    } else if (fresh.length) {
      window.busUtil.runHooks("poll", { room: busKey(), fresh });
    }
    primed = true;  // history loaded — notify only for new arrivals
    setStatus("live — " + busKey(), "live");
  } catch (e) {
    setStatus("error: " + e.message, "err");
  } finally {
    pollInFlight = false;
  }
}

$("go").addEventListener("click", () => {
  if (!$("url").value.trim() || !$("token").value) {
    setStatus("enter the REST URL and token first", "err");
    return;
  }
  try {
    localStorage.setItem("relay-url", $("url").value.trim());
    localStorage.setItem("relay-token", $("token").value);
    localStorage.setItem("relay-room", $("room").value.trim());
    localStorage.setItem("relay-mynick", $("mynick").value.trim());
  } catch (e) { /* private mode etc. — just don't persist */ }
  if (timer) clearInterval(timer);
  seen = 0;
  primed = false;  // don't notify for the backlog we're about to load
  log.innerHTML = "";
  $("panels").innerHTML = "";  // features rebuild on the connect hook
  setStatus("connecting…");
  poll();
  pollPresence();
  timer = setInterval(() => { poll(); pollPresence(); }, 2000);
  $("go").textContent = "Reconnect";
});

function refreshNotifyBtn() {
  const b = $("notifyBtn");
  if (!("Notification" in window)) {
    b.disabled = true;
    b.textContent = "No notifications";
    return;
  }
  if (Notification.permission === "granted") {
    b.disabled = true;
    b.textContent = "Notifications on";
  } else if (Notification.permission === "denied") {
    b.disabled = true;
    b.textContent = "Notifications blocked";
  } else {
    b.disabled = false;
    b.textContent = "Notify me";
  }
}

$("notifyBtn").addEventListener("click", async () => {
  if (!myNick()) {
    setStatus("enter your nick first so we know what to watch for", "err");
    $("mynick").focus();
    return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm === "granted") setStatus("live — " + busKey(), "live");
    else setStatus("notifications not granted", "err");
  } catch (e) {
    setStatus("notifications unavailable: " + e.message, "err");
  }
  refreshNotifyBtn();
});
refreshNotifyBtn();

// restore previous settings
try {
  $("url").value = localStorage.getItem("relay-url") || "";
  $("token").value = localStorage.getItem("relay-token") || "";
  $("room").value = localStorage.getItem("relay-room") || "";
  $("mynick").value = localStorage.getItem("relay-mynick") || "";
} catch (e) {}
// ==================== FEATURES ====================
// Self-contained feature modules (IIFEs) using window.busHooks and
// window.busUtil. Each registers message/connect/poll hooks; the core
// log above never depends on them.

// feature: taskboard — kanban from TODO:/CLAIM:/DONE:/REOPEN: messages.
// Self-contained IIFE. Hooks: connect (backfill from room history),
// poll (incremental). Pure stream processing — no extra fetching needed.
(function () {
  "use strict";
  var W = (typeof window !== "undefined") ? window : {};
  var U = W.busUtil, H = W.busHooks;
  if (!U || !H) return;

  // state.tasks: [{n, title, st: "open"|"claimed"|"done", by, creator}]
  // Task #n = nth valid TODO seen, in order.
  var state = { tasks: [] };

  var RE_TODO = /^TODO:\s*(.+?)\s*$/i;
  var RE_CLAIM = /^CLAIM:\s*(\d+)\s*$/i;
  var RE_DONE = /^DONE:\s*(\d+)\s*$/i;
  var RE_REOPEN = /^REOPEN:\s*(\d+)\s*$/i;

  function byNum(n) {
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].n === n) return state.tasks[i];
    }
    return null;
  }

  // Returns true when the line was a recognized task command.
  function ingest(nick, text) {
    try {
      var t = String(text == null ? "" : text).trim();
      var m, num, task;
      if ((m = t.match(RE_TODO))) {
        var title = m[1].trim();
        if (!title) return false;
        state.tasks.push({ n: state.tasks.length + 1, title: title,
          st: "open", by: null, creator: nick });
        return true;
      }
      if ((m = t.match(RE_CLAIM))) {
        num = parseInt(m[1], 10);
        task = byNum(num);
        if (!task || task.st === "done") return false;
        task.st = "claimed";
        task.by = nick;
        return true;
      }
      if ((m = t.match(RE_DONE))) {
        num = parseInt(m[1], 10);
        task = byNum(num);
        if (!task) return false;
        task.st = "done";
        return true;
      }
      if ((m = t.match(RE_REOPEN))) {
        num = parseInt(m[1], 10);
        task = byNum(num);
        if (!task) return false;
        task.st = "open";
        task.by = null;
        return true;
      }
    } catch (e) { /* parsing must never throw */ }
    return false;
  }

  function reset() { state.tasks = []; }

  function render() {
    try {
      var body = U.panel("tasks", "Tasks");
      var open = [], claimed = [], done = [];
      for (var i = 0; i < state.tasks.length; i++) {
        var t = state.tasks[i];
        (t.st === "open" ? open : t.st === "claimed" ? claimed : done).push(t);
      }
      if (!state.tasks.length) {
        body.innerHTML = '<div class="trow">no tasks — post ' +
          "<b>TODO: …</b> to add one</div>";
        return;
      }
      body.innerHTML = section("Open", open) +
        section("Claimed", claimed) + section("Done", done);
    } catch (e) { /* rendering must never throw */ }
  }

  function section(name, list) {
    var html = "<div><b>" + U.esc(name) + '</b> <span class="pill">' +
      list.length + "</span>";
    for (var i = 0; i < list.length; i++) html += row(list[i]);
    return html + "</div>";
  }

  function row(t) {
    var extra = "";
    if (t.st === "claimed" && t.by) {
      extra = ' <span class="pill" style="color:' + U.nickColor(t.by) +
        '">' + U.esc(t.by) + "</span>";
    }
    return '<div class="trow"><b>#' + t.n + "</b> " + U.esc(t.title) +
      extra + "</div>";
  }

  try {
    H.connect.push(function (ctx) {
      try {
        reset();
        var h = (ctx && ctx.history) || [];
        for (var i = 0; i < h.length; i++) ingest(h[i].nick, h[i].text);
        render();
      } catch (e) {}
    });
    H.poll.push(function (ctx) {
      try {
        var fresh = (ctx && ctx.fresh) || [], changed = false;
        for (var i = 0; i < fresh.length; i++) {
          if (ingest(fresh[i].nick, fresh[i].text)) changed = true;
        }
        if (changed) render();
      } catch (e) {}
    });
  } catch (e) {}

  // Test hook: pure logic exposed without touching the DOM.
  try {
    W.__busTest = W.__busTest || {};
    W.__busTest.taskboard = {
      ingest: ingest,
      reset: reset,
      snapshot: function () {
        return JSON.parse(JSON.stringify(state.tasks));
      }
    };
  } catch (e) {}
})();
// === feature: taskboard ===
// feature: polls — POLL:/VOTE: messages rendered as bar charts.
// Self-contained IIFE. Hooks: connect (backfill), poll (incremental).
// One vote per nick per poll; the latest vote wins.
(function () {
  "use strict";
  var W = (typeof window !== "undefined") ? window : {};
  var U = W.busUtil, H = W.busHooks;
  if (!U || !H) return;

  // state.polls: [{n, q, opts:[label], ballots:{nickLower: optIdx}}]
  // Poll #n = nth valid POLL seen, in order.
  var state = { polls: [] };

  var RE_POLL = /^POLL:\s*(.+?)\s*$/i;
  var RE_VOTE = /^VOTE:\s*(\d+)\s+(.+?)\s*$/i;

  function parsePoll(text) {
    var m = String(text).match(RE_POLL);
    if (!m) return null;
    var parts = m[1].split("|");
    var clean = [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i].trim();
      if (p) clean.push(p);
    }
    if (clean.length < 3) return null; // question + at least 2 options
    var opts = [], seen = {};
    for (var j = 1; j < clean.length; j++) {
      var k = clean[j].toLowerCase();
      if (seen[k]) continue; // dedupe case-insensitively, keep first
      seen[k] = true;
      opts.push(clean[j]);
    }
    if (opts.length < 2) return null;
    return { q: clean[0], opts: opts };
  }

  function findPoll(n) {
    for (var i = 0; i < state.polls.length; i++) {
      if (state.polls[i].n === n) return state.polls[i];
    }
    return null;
  }

  // Returns true when the line was a recognized poll command.
  function ingest(nick, text) {
    try {
      var t = String(text == null ? "" : text).trim();
      var parsed = parsePoll(t);
      if (parsed) {
        state.polls.push({ n: state.polls.length + 1, q: parsed.q,
          opts: parsed.opts, ballots: {} });
        return true;
      }
      var m = t.match(RE_VOTE);
      if (m) {
        var want = m[2].trim().toLowerCase();
        if (!want) return false;
        var poll = findPoll(parseInt(m[1], 10));
        if (!poll) return false;
        var idx = -1;
        for (var j = 0; j < poll.opts.length; j++) {
          if (poll.opts[j].toLowerCase() === want) { idx = j; break; }
        }
        if (idx < 0) return false;
        poll.ballots[String(nick).toLowerCase()] = idx; // latest wins
        return true;
      }
    } catch (e) { /* parsing must never throw */ }
    return false;
  }

  function reset() { state.polls = []; }

  function countsOf(poll) {
    var counts = [];
    for (var i = 0; i < poll.opts.length; i++) counts.push(0);
    for (var k in poll.ballots) {
      if (Object.prototype.hasOwnProperty.call(poll.ballots, k)) {
        counts[poll.ballots[k]]++;
      }
    }
    return counts;
  }

  function render() {
    try {
      var body = U.panel("polls", "Polls");
      if (!state.polls.length) {
        body.innerHTML = '<div class="prow">no polls — post ' +
          "<b>POLL: question | opt1 | opt2</b></div>";
        return;
      }
      var html = "";
      for (var i = 0; i < state.polls.length; i++) {
        html += pollHtml(state.polls[i]);
      }
      body.innerHTML = html;
    } catch (e) { /* rendering must never throw */ }
  }

  function pollHtml(p) {
    var counts = countsOf(p);
    var total = 0, max = 1, i;
    for (i = 0; i < counts.length; i++) {
      total += counts[i];
      if (counts[i] > max) max = counts[i];
    }
    var html = '<div class="prow"><b>#' + p.n + " " + U.esc(p.q) + "</b>";
    for (i = 0; i < p.opts.length; i++) {
      var c = counts[i];
      var pct = total ? Math.round((c / total) * 100) : 0;
      var w = Math.round((c / max) * 100);
      html += "<div>" + U.esc(p.opts[i]) + ' <span class="pill">' + c +

      ctx.el.appendChild(box);
    } catch (e) { return Promise.resolve(); }
    // Returned so tests can await it; runHooks ignores the value.
    return fetchBlob(ptr.hash, ptr.name, ptr.count).then(function (rec) {
      try { renderInto(box, rec); }
      catch (e) {
        try { box.textContent = "blob render failed"; } catch (_) {}
      }
    }).catch(function (err) {
      try {
        box.className = "countdown burn";
        box.textContent = "blob unavailable: " +
          (err && err.message ? err.message : String(err));
      } catch (_) {}
    });
  }

  H.message.push(onMessage);

  // Test seam (harmless in production).
  try {
    window.__blobTest = {
      parseBlob: parseBlob, fetchBlob: fetchBlob, renderInto: renderInto,
      b64ToBytes: b64ToBytes, cache: cache
    };
  } catch (e) {}
})();
// === feature: blobs ===
// === feature: fleet ===
// Parses HEALTH reports from the bus (backfill + incremental) and renders a
// "Fleet" panel: one card per nick with cpu/mem/disk bars, uptime, load,
// and "updated Xs ago". Cards with no report for >5 min go dim + "stale".
(function () {
  "use strict";
  var U = window.busUtil, H = window.busHooks;
  if (!U || !H) return;

  var RE = /HEALTH cpu=(\d+)% mem=(\d+)% disk=(\d+)% up=([0-9dhms]+) load=([\d.]+)/;
  var STALE_MS = 5 * 60 * 1000;
  var hosts = {}; // nick -> {cpu,mem,disk,up,load,at}

  function parse(text) {
    try {
      var m = String(text).match(RE);
      if (!m) return null;
      return { cpu: +m[1], mem: +m[2], disk: +m[3], up: m[4], load: m[5] };
    } catch (e) { return null; }
  }

  function ingest(nick, text, at) {
    var h = parse(text);
    if (!h) return;
    at = at || Date.now();
    var prev = hosts[nick];
    if (prev && at < prev.at) return; // keep the latest report only
    hosts[nick] = { cpu: h.cpu, mem: h.mem, disk: h.disk, up: h.up,
                    load: h.load, at: at };
  }

  function ago(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + "s ago";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    return Math.floor(m / 60) + "h ago";
  }

  function barRow(label, pct) {
    var p = Math.max(0, Math.min(100, Math.round(pct)));
    var cls = p >= 80 ? "bar amber" : "bar green";
    return '<div>' + label + ' ' + p + '%' +
      '<div class="' + cls + '" style="width:' + p + '%"></div></div>';
  }

  function render() {
    try {
      var body = U.panel("fleet", "Fleet");
      var nicks = Object.keys(hosts).sort();
      if (!nicks.length) {
        body.innerHTML = '<div class="prow">no health reports yet</div>';
        return;
      }
      var now = Date.now();
      body.innerHTML = nicks.map(function (n) {
        var h = hosts[n];
        var stale = (now - h.at) > STALE_MS;
        return '<div class="prow"' + (stale ? ' style="opacity:.45"' : '') + '>' +
          '<span style="color:' + U.nickColor(n) + ';font-weight:700">' +
          U.esc(n) + '</span>' +
          (stale ? '<span class="pill">stale</span>' : '') +
          barRow("cpu", h.cpu) + barRow("mem", h.mem) + barRow("disk", h.disk) +
          '<div class="countdown">up ' + U.esc(h.up) + ' · load ' +
          U.esc(h.load) + ' · updated ' + ago(now - h.at) + '</div>' +
          '</div>';
      }).join("");
    } catch (e) { /* panel is decorative */ }
  }

  H.message.push(function (ctx) {
    try { ingest(ctx.nick, ctx.text, Date.now()); render(); } catch (e) {}
  });
  H.connect.push(function (ctx) {
    try {
      (ctx.history || []).forEach(function (m) {
        ingest(m.nick, m.text, Date.now());
      });
      render();
    } catch (e) {}
  });
  H.poll.push(function () { try { render(); } catch (e) {} });

  try {
    (window.__w4 = window.__w4 || {}).fleet =
      { parse: parse, ingest: ingest, hosts: hosts, render: render,
        STALE_MS: STALE_MS };
  } catch (e) {}
})();
// === feature: fleet ===
// === feature: receipts ===
// Read receipts. Publishes this viewer's max seen index to
// muse-bus:seen:<roomkey> {nick: offset} on every tick, then decorates the
// 10 most recent rendered messages with a ".readby" line listing other
// nicks whose offset is past that message. Best-effort throughout.
(function () {
  "use strict";
  var U = window.busUtil, H = window.busHooks;
  if (!U || !H) return;

  var maxIdx = -1;
  var recent = []; // [{nick, idx, el}], capped at 30

  function seenKey() { return "muse-bus:seen:" + U.busKey(); }

  function record(ctx) {
    try {
      if (typeof ctx.idx === "number" && ctx.idx > maxIdx) maxIdx = ctx.idx;
      if (ctx.el) {
        recent.push({ nick: ctx.nick, idx: ctx.idx, el: ctx.el });
        if (recent.length > 30) recent.splice(0, recent.length - 30);
      }
    } catch (e) {}
  }

  function elAttached(el) {
    // Reconnects wipe the log; don't decorate detached nodes.
    try {
      if (!el) return false;
      if (typeof el.isConnected === "boolean") return el.isConnected;
      return true;
    } catch (e) { return false; }
  }

  function asMap(result) {
    // hgetall may come back as an object or a flat [k,v,...] array.
    var m = {};
    try {
      if (!result) return m;
      if (Array.isArray(result)) {
        for (var i = 0; i + 1 < result.length; i += 2)
          m[String(result[i])] = result[i + 1];
      } else if (typeof result === "object") {
        Object.keys(result).forEach(function (k) { m[k] = result[k]; });
      }
    } catch (e) {}
    return m;
  }

  function decorate(msg, seenMap, me) {
    try {
      var el = msg.el;
      if (!elAttached(el)) return;
      var old = el.querySelector ? el.querySelector(".readby") : null;
      var isOwn = String(msg.nick).toLowerCase() === me.toLowerCase();
      if (isOwn) { if (old && old.remove) old.remove(); return; }
      var readers = Object.keys(seenMap).filter(function (n) {
        if (n.toLowerCase() === me.toLowerCase()) return false;
        if (n.toLowerCase() === String(msg.nick).toLowerCase()) return false;
        return Number(seenMap[n]) > msg.idx; // strictly past this message
      }).sort();
      if (!readers.length) { if (old && old.remove) old.remove(); return; }
      var html = "read by " + readers.map(U.esc).join(", ");
      if (old) { old.textContent = html; }
      else if (el.ownerDocument && el.ownerDocument.createElement) {
        var d = el.ownerDocument.createElement("div");
        d.className = "readby";
        d.textContent = html;
        el.appendChild(d);
      }
    } catch (e) {}
  }

  async function tick() {
    try {
      var me = U.myNick();
      if (!me) return;
      if (maxIdx >= 0) {
        try {
          await U.api("/hset/" + seenKey() + "/" +
            encodeURIComponent(me) + "/" + maxIdx);
        } catch (e) { /* best-effort */ }
      }
      var seenMap = {};
      try {
        var r = await U.api("/hgetall/" + seenKey());
        seenMap = asMap(r && r.result);
      } catch (e) { seenMap = {}; }
      recent.slice(-10).forEach(function (m) { decorate(m, seenMap, me); });
    } catch (e) {}
  }

  function fire() {
    try { var p = tick(); if (p && p.catch) p.catch(function () {}); }
    catch (e) {}
  }

  H.message.push(record);
  H.connect.push(fire);
  H.poll.push(fire);

  try {
    (window.__w4 = window.__w4 || {}).receipts =
      { record: record, tick: tick, asMap: asMap, decorate: decorate,
        state: function () { return { maxIdx: maxIdx, recent: recent }; } };
  } catch (e) {}
})();
// === feature: receipts ===
// === feature: ephemeral ===
// Self-destructing messages. Reads muse-bus:eph:<roomkey> entries of the
// form "<expiry-unix>:<nick>: <text>" on connect and every poll tick, drops
// expired/malformed ones, and renders the live ones in a "Burning" panel
// with a live mm:ss countdown.
(function () {
  "use strict";
  var U = window.busUtil, H = window.busHooks;
  if (!U || !H) return;

  function parse(line) {
    try {
      var s = String(line);
      var i = s.indexOf(":");
      if (i <= 0) return null;
      var exp = parseInt(s.slice(0, i), 10);
      if (!isFinite(exp)) return null;
      var rest = s.slice(i + 1);
      var j = rest.indexOf(":");
      if (j <= 0) return null;
      var nick = rest.slice(0, j).trim();
      var text = rest.slice(j + 1).trim();
      if (!nick) return null;
      return { exp: exp, nick: nick, text: text };
    } catch (e) { return null; }
  }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  async function tick() {
    try {
      var body = U.panel("ephemeral", "Burning");
      var lines = [];
      try {
        var r = await U.api("/lrange/muse-bus:eph:" + U.busKey() + "/0/-1");
        lines = (r && r.result) || [];
      } catch (e) { /* keep whatever we render below */ }
      var now = Date.now() / 1000;
      var live = [];
      for (var i = 0; i < lines.length; i++) {
        var p = parse(lines[i]);
        if (!p) continue;          // malformed — skip
        if (p.exp <= now) continue; // expired — drop
        live.push(p);
      }
      live.sort(function (a, b) { return a.exp - b.exp; });
      if (!live.length) {
        body.innerHTML = '<div class="prow burn">nothing burning</div>';
        return;
      }
      body.innerHTML = live.map(function (p) {
        return '<div class="prow"><span class="burn">&#128293;</span> ' +
          '<span style="color:' + U.nickColor(p.nick) +
          ';font-weight:700">' + U.esc(p.nick) + '</span> ' +
          U.esc(p.text) + ' <span class="countdown">' +
          fmt(p.exp - now) + '</span></div>';
      }).join("");
    } catch (e) { /* panel is decorative */ }
  }

  function fire() {
    try { var p = tick(); if (p && p.catch) p.catch(function () {}); }
    catch (e) {}
  }

  H.connect.push(fire);
  H.poll.push(fire);

  try {
    (window.__w4 = window.__w4 || {}).ephemeral =
      { parse: parse, fmt: fmt, tick: tick };
  } catch (e) {}
})();
// === feature: ephemeral ===
// === feature: dead-drops ===
// Private rooms by shared secret. "Join" derives room dm-<sha1(secret)[:12]>,
// switches the room input to it, and reconnects; "Leave" goes back to main.
// Obscurity, not encryption — anyone who guesses the secret can read it.
(function () {
  "use strict";
  var U = window.busUtil, H = window.busHooks;
  if (!U || !H) return;

  var gid = (typeof $ === "function") ? $
    : function (id) { return document.getElementById(id); };

  function subtle() {
    try {
      if (window.crypto && window.crypto.subtle) return window.crypto.subtle;
    } catch (e) {}
    return null;
  }

  async function sha1hex(str) {
    var data = new TextEncoder().encode(str);
    var buf = await subtle().digest("SHA-1", data);
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return (b < 16 ? "0" : "") + b.toString(16);
    }).join("");
  }

  function err(msg) {
    try {
      var e = gid("dm-err");
      if (e) e.textContent = msg;
    } catch (x) {}
  }

  async function join() {
    try { err(""); } catch (e) {}
    var sub = subtle();
    if (!sub) {
      err("crypto.subtle is unavailable here (needs HTTPS or localhost) — " +
        "dead drops won't work in this context.");
      return;
    }
    var inp = gid("dm-secret");
    var secret = inp ? String(inp.value || "") : "";
    if (!secret) { err("enter a shared secret first."); return; }
    try {
      var hex = await sha1hex(secret);
      var room = "dm-" + hex.slice(0, 12);
      gid("room").value = room;
      try { localStorage.setItem("relay-room", room); } catch (e) {}
      if (inp) inp.value = "";
      U.reconnect();
    } catch (e) {
      err("could not derive room: " + (e && e.message ? e.message : e));
    }
  }

  function leave() {
    try { err(""); } catch (e) {}
    try {
      gid("room").value = "";
      try { localStorage.setItem("relay-room", ""); } catch (e) {}
      U.reconnect();
    } catch (e) {}
  }

  function render() {
    try {
      var body = U.panel("dm", "Dead drops");
      body.innerHTML =
        '<div class="prow">Private rooms derived from a shared secret. ' +
        'Obscurity, not encryption — anyone who guesses the secret can ' +
        'read it.</div>' +
        '<div class="prow">now: <b>' + U.esc(U.roomName()) + '</b></div>' +
        '<div class="prow">' +
        '<input id="dm-secret" type="password" placeholder="shared secret" ' +
        'style="background:#0d1117;border:1px solid #30363d;color:#c9d1d9;' +
        'border-radius:6px;padding:5px 9px;font-size:13px;width:150px"> ' +
        '<button id="dm-join">Join</button> ' +
        '<button id="dm-leave">Leave</button></div>' +
        '<div class="prow" id="dm-err" style="color:#f85149"></div>';
      var j = body.querySelector("#dm-join");
      var l = body.querySelector("#dm-leave");
      if (j && j.addEventListener) j.addEventListener("click", join);
      if (l && l.addEventListener) l.addEventListener("click", leave);
    } catch (e) { /* panel is decorative */ }
  }

  H.connect.push(render);

  try {
    (window.__w4 = window.__w4 || {}).dm =
      { sha1hex: sha1hex, join: join, leave: leave, render: render,
        subtle: subtle };
  } catch (e) {}
})();
// === feature: dead-drops ===
